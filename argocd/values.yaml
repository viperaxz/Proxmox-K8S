# Central configuration for all ArgoCD-managed applications
# Generated by bootstrap.sh on luni 2 februarie 2026, 23:47:15 +0200

# Git repository settings
git:
  repoURL: https://github.com/viperaxz/Proxmox-K8S.git
  targetRevision: main
  
# Cluster settings
cluster:
  domain: viperax.org
  
# MetalLB settings
metallb:
  ipRange: "192.168.1.230-192.168.1.250"

# NFS Provisioner settings
nfs:
  server: "192.168.1.101"
  path: "/mnt/hdd"

# TLS settings
tls:
  mode: staging
  certResolver: letsencrypt-staging
  cloudflare:
    email: "cristianvladucu@pm.me"

# Traefik settings
traefik:
  replicas: 1
  dashboard:
    enabled: true

# Monitoring settings
monitoring:
  prometheus:
    retention: 15d
    storageSize: 20Gi
  grafana:
    storageSize: 5Gi
  loki:
    retention: 168h
    storageSize: 20Gi

# ArgoCD settings
argocd:
  syncPolicy: manual
