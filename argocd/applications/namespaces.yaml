# ArgoCD Application for Namespaces
# This should be deployed first as other apps depend on namespaces existing
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/viperaxz/Proxmox-K8S.git
    targetRevision: main
    path: kubernetes
    directory:
      include: "namespaces.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: ""
      kind: Namespace
      jsonPointers:
        - /metadata/labels
        - /metadata/annotations
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
