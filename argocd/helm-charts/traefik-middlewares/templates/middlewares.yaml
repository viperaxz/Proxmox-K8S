# Local-only middleware - restricts access to local networks
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: local-only
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.localOnly.sourceRanges }}
      - {{ . | quote }}
      {{- end }}
---
# Security headers middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customFrameOptionsValue: "SAMEORIGIN"
---
# Rate limiting middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: {{ .Release.Namespace }}
spec:
  rateLimit:
    average: 100
    burst: 50
