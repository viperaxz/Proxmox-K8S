{{- if .Values.ingress.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headlamp.{{ .Values.cluster.domain }}`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
  tls: {}
{{- end }}
